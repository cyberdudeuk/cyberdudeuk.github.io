name: CDDO conformance replay

on:
  push:
    branches:
      - "docs/portfolio-architecture-consolidation-plan"

permissions:
  contents: read

jobs:
  replay:
    name: Run the canonical checker against pinned source snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the portfolio evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run checker self-test and replay all three repositories
        run: python3 -I tools/verify_cddo_conformance.py
