name: Discover
# Tier 2 (ops/automation.yaml): daily, lists public repositories missing from the launchpad, gone from it, or newer
# than their card, in one issue labelled routine, and prepares the change on the routine/discover branch for the owner
# to review and merge. Never changes main (the ruleset requires a pull request). Plain commands only (ADR 0002).
on:
  schedule: [{cron: '37 6 * * *'}]   # every day 06:37 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the routine/discover branch only; main is protected by the ruleset
      issues: write
    steps:
      - name: Check out the commit (plain git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Python environment (takes effect from the next step)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools into the environment
        run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION: ${{ vars.AUTOMATION }}
        run: python tools/discover.py --propose
