name: Checks
# Tier 0 (ops/automation.yaml). Every pull request and push to main: static checks (including a rebuild that must match
# the committed page), vaccination tests, script syntax, browser checks and their deliberate breaks. Plain commands only
# (ADR 0002).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit (plain git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Python environment (takes effect from the next step)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools into the environment
        run: pip install -r requirements.txt
      - run: python tools/check_site.py
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - name: Linters (fail on any finding)
        run: |
          ruff check .
          npm install --no-save --no-package-lock eslint@9.39.5 @eslint/js@9.39.5 globals@16.5.0
          npx eslint .
      - run: python tools/check_browser.py
      - name: Browser check vaccinations
        run: for b in overflow consoleerror filters drawer redirect search theme motion density coverage nojs counters a11y totop arrow rings notegap spotlight masthead; do python tools/check_browser.py --break "$b"; done
