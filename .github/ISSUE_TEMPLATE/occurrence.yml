name: Something nearly went wrong (near miss)
description: A near miss or a surprise. No blame; it is used to stop the next defect.
title: "[Occurrence] "
labels: ["occurrence"]
body:
  - type: markdown
    attributes:
      value: This form is public. Do not include personal data or anything above OFFICIAL. Tell us what happened, not who did it.
  - type: input
    id: where
    attributes:
      label: Where?
      description: Page, file, routine or workflow
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, or nearly happened?
    validations:
      required: true
  - type: textarea
    id: caught
    attributes:
      label: What caught it, or what would have?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal data or anything sensitive
          required: true
