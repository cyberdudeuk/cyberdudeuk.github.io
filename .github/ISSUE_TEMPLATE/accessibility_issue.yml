name: An accessibility barrier
description: Anything that stops you using the site with assistive technology or a keyboard. Treated as a priority defect.
title: "[Accessibility] "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Do not include personal data, names of colleagues, case details or anything above OFFICIAL.
        There is no email route: this form is the way to contact the maintainer.
  - type: input
    id: where
    attributes:
      label: Where? (section or card)
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What stopped you?
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: Assistive technology, browser and device (optional)
      description: For example NVDA with Firefox, VoiceOver on iPhone, or keyboard only
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal data, case details or anything above OFFICIAL
          required: true
