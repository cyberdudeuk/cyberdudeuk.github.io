# Labels as code (estate contract). The labels workflow creates or updates these; it never deletes a label.
- {name: routine, color: '5694ca', description: Proposed or raised by an automated routine for a person to decide (ops/automation.yaml)}
- {name: digest, color: '0b0c0c', description: The weekly operations digest (digest routine)}
- {name: health, color: '00703c', description: Raised by the weekly health run}
- {name: review due, color: 'b58840', description: The content review date is near or past}
- {name: owner action, color: '0b0c0c', description: Only the repository owner can do this}
- {name: needs-reply, color: 'f47738', description: Waiting longer than it should for a maintainer reply (triage routine)}
- {name: overdue, color: 'd4351c', description: Waiting longer than it should for a decision (triage routine)}
- {name: occurrence, color: 'f47738', description: A near miss or surprise reported without blame, so the next defect is prevented}
- {name: trial, color: '28a197', description: A time-limited experiment with its own envelope and kill switch (ops/automation.yaml trials)}
- {name: contact, color: '1d70b8', description: Raised through the contact form}
- {name: bug, color: 'd4351c', description: Something on the site is broken}
- {name: accessibility, color: '00703c', description: An accessibility barrier; treated as a priority defect}
- {name: listing, color: '28a197', description: A project to add to the launchpad, or a card to correct}
