version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  # Proposes new commits for the pinned actions (ADR 0002). A person checks each commit against its release tag first.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    # CodeQL's init, analyze and upload-sarif steps must run the same version. Bumped
    # one at a time they fail with "Loaded a configuration file for version X, but running
    # version Y" (seen on 13 Nov 2026). This group moves them in one pull request.
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
