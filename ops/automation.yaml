# Automation policy for the cyberdudeuk launchpad (the estate contract; reference: DCAT-AP-UK ADR 0017).
# Every workflow in .github/workflows is listed here with its tier. tests/test_automation.py fails if one is missing.
#   0 observe   reads and reports only. 1 maintain  changes derived output after every check passes; one revert undoes it.
#   2 propose   prepares a change for a person to decide. 3 person   never automated.
# Besides publishing, the labels routine is the only tier 1 routine, and it honours the kill switch: set the repository
# variable AUTOMATION to "off" and it reports what it would have done and changes nothing.

kill_switch: {variable: AUTOMATION, off_value: 'off'}
oversight:
  digest: Every Monday the digest routine opens one issue (label digest) with the discovery verdict, routine commits, failed runs and what needs a person. It closes last week's.
  undo: Publishing rebuilds from main, so reverting a commit on main undoes what was published.
  audit: Workflow run logs are kept by GitHub for 90 days; the digest links to failed runs.

routines:
  - {id: publish, workflow: pages.yml, tier: 1, when: 'every push to main, on request', does: 'Runs every check again, then publishes index.html, 404.html, styles.css, app.js and data/ to GitHub Pages.', changes: 'The published site only, after every check passes.'}
  - {id: checks, workflow: checks.yml, tier: 0, when: 'every push to main, every pull request, on request', does: 'Static checks (including a rebuild that must match the committed page), vaccination tests, script syntax, browser checks and their deliberate breaks.', changes: 'Nothing; fails the pull request.'}
  - {id: discover, workflow: discover.yml, tier: 0, when: 'Mondays 06:37 UTC, on request', does: 'Lists public repositories missing from the launchpad, gone from it, or pushed since their card was updated.', changes: 'One issue labelled routine; never the list.'}
  - {id: triage, workflow: triage.yml, tier: 0, when: 'weekdays 07:23 UTC, on request', does: 'Labels contact, accessibility, bug and listing issues that have waited too long for a reply (needs-reply) or a decision (overdue).', changes: 'Labels on issues only.'}
  - {id: digest, workflow: digest.yml, tier: 0, when: 'Mondays 08:13 UTC, on request', does: 'Weekly operations digest for the owner.', changes: 'One issue a week (label digest); closes the previous one.'}
  - {id: labels, workflow: labels.yml, tier: 1, when: 'when .github/labels.yml changes on main, on request', does: 'Creates or updates the labels in .github/labels.yml. Never deletes a label.', changes: 'Labels only. Honours the kill switch.'}
  - {id: codeql, workflow: codeql.yml, tier: 0, when: 'every push to main, every pull request, Wednesdays', does: 'Scans the code for security problems with the pinned, digest-checked CodeQL bundle.', changes: 'Security alerts only.'}
  - {id: scorecard, workflow: scorecard.yml, tier: 0, when: 'Mondays, on request, when branch rules change', does: 'OpenSSF Scorecard: an independent check of how the repository is run.', changes: 'Security alerts only.'}
  - {id: dependency-review, workflow: dependency-review.yml, tier: 0, when: 'every pull request', does: 'Stops a pull request that adds a dependency with a known moderate or worse vulnerability.', changes: 'Nothing; fails the pull request.'}

trials: []

occurrences:
  label: occurrence
  how: 'Anyone, person or routine, reports a near miss or a surprise with the occurrence issue form. No blame.'
  follow_up: 'Every occurrence closes with either a check that would have caught it or a recorded reason why none is needed.'

never:
  - Change repository settings, rulesets, secrets or the kill switch.
  - Delete a branch, tag, release, issue, label or file a person made.
  - Send anything outside the repository (pull requests or issues elsewhere, email, posts).
  - Add, remove or reword a project on the launchpad (a person edits data/projects.json).
  - Claim conformance, endorsement or approval.
  - Merge a pull request.
